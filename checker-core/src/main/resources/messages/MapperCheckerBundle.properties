# 团队规范规则（DAL）
issue.DAL-022=DAO 方法 ''{0}'' 的 Query 参数 ''{1}'' 应注解为 @Param("query")，当前为 {2}。
issue.DAL-022.none=无 @Param
issue.DAL-020=转换方法 ''{0}'' 内使用了反射拷贝 {1}，拷了哪些字段只有运行期才知道，会让参数流向追踪失效。
issue.DAL-004=''{0}'' 的参数顺序疑似写反：源对象位置传入的是刚 new 出来的空对象 ''{1}''，会把目标对象整个清空。
issue.DAL-030.typo=跨层赋值 setter ''{0}'' 与 getter ''{1}'' 的字段名高度相似但不一致，疑似手滑改名。
issue.DAL-030.plural=跨层赋值 setter ''{0}'' 与 getter ''{1}'' 是单复数 / 集合变体，跨层不得改名，确需转换请注释说明。
issue.DAL-002=Mapper ''{0}'' 引用了实体 ''{1}'' 中不存在的属性 ''{2}''，OGNL 会静默求值为 null，该条件永远不命中。
remark.DAL-002.similar=实体里有近似属性 ''{0}''，多为改名漏改。
issue.DAL-003=模板语句 ''{0}'' 里 <{1} {2}> 判断的是 ''{3}''，块内绑定的却是 ''{4}''，会把错误的值写进该列。
issue.DAL-010=实体 ''{0}'' 的属性 ''{1}'' 有调用方 set（如 {2}），但该实体关联的 {3} 条 statement 都不引用它，疑似删条件后残留。
issue.DAL-011=实体 ''{0}'' 的属性 ''{1}'' 既无人 set，也不被关联的 {2} 条 statement 引用，属死字段。
remark.reflective.copy.target=该实体是 copyProperties 反射赋值的目标，字段来源无法静态确认，需人工核实。
remark.related.statements=关联 statement：{0}
task.queryClass=正在聚合实体字段使用情况（{0} / {1}）：{2}
issue.DAL-021=Query 类 ''{0}'' 在多个模块中同名：{1}。按简单类名索引的工具会互相污染，人读代码也会认错。
