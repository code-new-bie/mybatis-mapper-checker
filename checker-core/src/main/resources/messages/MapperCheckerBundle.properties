# MyBatis Mapper Checker 文案（默认中文）
# 规则 ID、类名、Extension Point 名保留英文。

plugin.name=MyBatis Mapper Checker

# 规则
rule.MMC001.name=参数已声明或传入，但 Mapper SQL 未使用
rule.MMC002.name=statement 不存在
rule.MMC003.name=statement 存在多个候选

# 问题文案
issue.MMC001.declared=参数 ''{0}'' 已声明在 ''{1}''，但对应 Mapper SQL 未使用该参数。
issue.MMC001.passed=参数 ''{0}'' 已传入 ''{1}''，但对应 Mapper SQL 未使用该参数。
issue.MMC002=''{0}'' 未找到对应的 Mapper statement 或 SQL 注解。
issue.MMC003=''{0}'' 匹配到多个 Mapper statement，无法确定实际调用目标。

# 备注
remark.bean.setter=参数来自 Bean setter，该属性可能另有用途，请人工确认。
remark.case.mismatch=Mapper 中存在 ''{0}''，疑似大小写不一致。
remark.maybe.in.library=可能定义在未索引的依赖中。
remark.db.variant=可能为多数据库变体。
remark.call.path=路径：{0}

# 置信度
confidence.high=高
confidence.medium=中
confidence.low=低

# 无法解析原因
unresolved.METHOD_PARAM=参数对象是方法入参
unresolved.FIELD=参数对象是类字段
unresolved.MULTI_IMPL=被调方法存在多个实现
unresolved.DEPTH_EXCEEDED=跨方法追踪深度超限
unresolved.CYCLE=方法调用链存在循环
unresolved.LIBRARY_CODE=被调方法位于库代码
unresolved.MAP_MUTATED=Map 被 putAll / remove / clear 修改
unresolved.MAP_KEY_DYNAMIC=Map key 不是可求值常量
unresolved.PROVIDER=使用 Provider 注解动态生成 SQL
unresolved.DYNAMIC_INCLUDE=include refid 不可静态确定
unresolved.STATEMENT_ID_DYNAMIC=statementId 不可静态确定
unresolved.BEAN_NO_SETTER=Bean 参数无 setter 调用
unresolved.BEAN_BUILDER=Bean 由 builder 链构造

