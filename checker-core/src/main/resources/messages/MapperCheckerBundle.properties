# 实体属性级检查
issue.DAL-001.property=实体 ''{0}'' 的属性 ''{1}'' 未被 ''{2}'' 的 Mapper SQL 使用。
remark.bean.property=属性来自实体类声明，该实体可能被多个 statement 共用，请人工确认。
