# 每次 push / PR：编译、跑全部测试、产出插件包并作为 Artifact 上传（保留 14 天）。
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'samples/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle（含依赖与 IDEA 平台缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译并测试
        run: ./gradlew build --no-daemon --stacktrace

      - name: 产出插件包
        run: ./gradlew :checker-idea:buildPlugin --no-daemon

      - name: 上传测试报告（失败时便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            checker-core/build/reports/tests/test
            checker-idea/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传插件包
        uses: actions/upload-artifact@v4
        with:
          name: mybatis-mapper-checker-plugin
          path: checker-idea/build/distributions/*.zip
          retention-days: 14
          if-no-files-found: error
