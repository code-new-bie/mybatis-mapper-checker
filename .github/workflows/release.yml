# 打 v* 标签时：以标签号为插件版本构建，跑 Plugin Verifier，创建 GitHub Release 并附上插件 zip。
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 由标签得到版本号
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 编译、测试、产出插件包
        run: ./gradlew build :checker-idea:buildPlugin --no-daemon -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Plugin Verifier（2023.3 / 2024.1 / 2024.2 / 2024.3）
        run: ./gradlew :checker-idea:verifyPlugin --no-daemon -PpluginVersion=${{ steps.version.outputs.value }}

      - name: 上传 Verifier 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: checker-idea/build/reports/pluginVerifier
          retention-days: 30
          if-no-files-found: ignore

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyBatis Mapper Checker ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: checker-idea/build/distributions/*.zip
