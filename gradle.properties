# 插件版本
pluginVersion=0.1.0-SNAPSHOT

# 编译平台：本地已缓存 2024.2.6，避免大体积下载。
# 这个版本只影响"用哪个 API 编译"、runIde 沙箱启动哪个版本，不代表插件只支持这个版本 —— 实际
# 支持范围由下面的 pluginSinceBuild（+ plugin.xml 的 untilBuild 留空）决定，并由
# checker-idea/build.gradle.kts 里 pluginVerification.ides 列出的具体版本做 Plugin Verifier 校验。
# 想在沙箱里跑别的版本：./gradlew :checker-idea:runIde -PplatformVersion=2025.3.6 （无需改这个文件，
# 命令行 -P 会覆盖这里；类型按版本号自动判断，2025.3/build 253 起自动换成合并后的统一发行版坐标）。
platformVersion=2024.2.6

# 兼容范围
pluginSinceBuild=233

# Gradle
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

# IntelliJ Platform Gradle Plugin
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck=false
